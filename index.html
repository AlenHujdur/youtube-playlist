<!doctype html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>YouTube Playlist</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="watch-area" aria-labelledby="page-title">
        <div class="title-row">
          <div>
            <p class="eyebrow" data-i18n="eyebrow">Video kolekcija</p>
            <h1 id="page-title" data-i18n="pageTitle">YouTube Playlist</h1>
          </div>
          <div class="top-controls">
            <label class="language-switch" for="languageSelect">
              <span data-i18n="languageLabel">Jezik</span>
              <select id="languageSelect" name="languageSelect">
                <option value="bs">Bosanski</option>
                <option value="nl">Nederlands</option>
              </select>
            </label>
            <span class="video-count" id="videoCount">0 videa</span>
          </div>
        </div>

        <div class="player-wrap">
          <iframe
            id="videoFrame"
            title="YouTube video player"
            width="560"
            height="315"
            src=""
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>

        <div class="current-video">
          <div>
            <p class="current-label" data-i18n="currentLabel">Trenutno se prikazuje</p>
            <h2 id="currentTitle">Odaberi video</h2>
          </div>
          <a id="openYoutube" class="youtube-link" href="#" target="_blank" rel="noopener" data-i18n="openYoutube">Otvori na YouTube</a>
        </div>
      </section>

      <aside class="playlist-panel" aria-label="Lista videa">
        <form class="add-form" id="addForm">
          <label for="youtubeUrl" data-i18n="addLinkLabel">Dodaj YouTube link</label>
          <div class="input-row">
            <input
              id="youtubeUrl"
              name="youtubeUrl"
              type="text"
              inputmode="url"
              autocomplete="off"
              placeholder="https://youtu.be/..."
              data-i18n-placeholder="linkPlaceholder"
              required
            />
            <button type="submit" data-i18n="addButton">Dodaj</button>
          </div>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>

        <div class="playlist-header">
          <h2 data-i18n="playlistTitle">Playlist</h2>
          <button
            class="ghost-button"
            id="resetButton"
            type="button"
            aria-controls="resetForm"
            aria-expanded="false"
            data-i18n="resetButton"
          >
            Reset
          </button>
        </div>

        <form class="reset-form" id="resetForm" hidden>
          <label for="resetPassword" data-i18n="resetPasswordLabel">Password za reset</label>
          <div class="input-row">
            <input
              id="resetPassword"
              name="resetPassword"
              type="password"
              autocomplete="off"
              data-i18n-placeholder="resetPasswordPlaceholder"
            />
            <button type="submit" data-i18n="confirmResetButton">Potvrdi</button>
          </div>
          <div class="reset-actions">
            <button class="ghost-button" id="cancelResetButton" type="button" data-i18n="cancelResetButton">Odustani</button>
          </div>
          <p class="reset-hint" data-i18n="resetPasswordHint">Unesi password da vratis originalnih 5 videa.</p>
          <p class="reset-message" id="resetMessage" role="status" aria-live="polite"></p>
        </form>

        <div class="video-list" id="videoList"></div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
